<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精灵图转GIF动画生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 40px;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .upload-section {
            margin-bottom: 40px;
            text-align: center;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: inline-block;
            padding: 10px 24px;
            background: white;
            color: #1a1a1a;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 400;
        }

        .file-input-label:hover {
            border-color: #1a1a1a;
            background: #fafafa;
        }

        .file-name {
            color: #666;
            font-size: 13px;
            margin-top: 8px;
        }

        .controls {
            background: #fafafa;
            padding: 30px;
            border-radius: 6px;
            margin-bottom: 40px;
            border: 1px solid #e8e8e8;
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #1a1a1a;
            font-weight: 400;
            font-size: 13px;
        }

        input[type="range"] {
            width: 100%;
            height: 2px;
            border-radius: 1px;
            background: #d0d0d0;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1a1a1a;
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1a1a1a;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
        }

        .value-display {
            display: inline-block;
            margin-left: 10px;
            color: #666;
            font-weight: 500;
            min-width: 45px;
            text-align: right;
        }

        .preview-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: #fafafa;
            border-radius: 6px;
            border: 1px solid #e8e8e8;
        }

        canvas {
            max-width: 100%;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: white;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 24px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 400;
            background: white;
            color: #1a1a1a;
        }

        button:hover:not(:disabled) {
            border-color: #1a1a1a;
            background: #fafafa;
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2a2a2a;
            border-color: #2a2a2a;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            border: 1px solid;
        }

        .status.info {
            background: #fafafa;
            color: #666;
            border-color: #e0e0e0;
        }

        .status.success {
            background: #fafafa;
            color: #1a1a1a;
            border-color: #d0d0d0;
        }

        .status.error {
            background: #fff5f5;
            color: #c33;
            border-color: #fcc;
        }

        .hidden {
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e8e8e8;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: #1a1a1a;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>精灵图转 GIF 动画</h1>
        <p style="text-align: center; color: #666; font-size: 14px; margin-top: 8px;">步骤2: 将精灵图转换为GIF动画</p>
        
        <!-- 上传区域 -->
        <div class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="imageInput" accept="image/*">
                <label for="imageInput" class="file-input-label">选择精灵图</label>
            </div>
            <div id="fileName" class="file-name"></div>
        </div>

        <!-- 控制面板 -->
        <div class="controls">
            <div class="control-group">
                <label>
                    帧率 (FPS): <span class="value-display" id="fpsValue">10</span>
                </label>
                <input type="range" id="fpsSlider" min="1" max="60" value="10">
            </div>

            <div class="control-group">
                <label>
                    缩放比例: <span class="value-display" id="scaleValue">100%</span>
                </label>
                <input type="range" id="scaleSlider" min="10" max="200" value="100">
            </div>
        </div>

        <!-- 预览区域 -->
        <div class="preview-section">
            <canvas id="canvas"></canvas>
        </div>

        <!-- 按钮组 -->
        <div class="button-group">
            <button id="playBtn" disabled>播放</button>
            <button id="pauseBtn" disabled>暂停</button>
            <button class="btn-primary" id="generateBtn" disabled>生成 GIF</button>
            <button class="btn-primary hidden" id="downloadBtn">下载 GIF</button>
        </div>

        <!-- 状态提示 -->
        <div id="status" class="status hidden"></div>
        <div id="progressBar" class="progress-bar hidden">
            <div id="progressFill" class="progress-fill"></div>
        </div>
    </div>

    <script>

    <script>
        // 全局变量
        let spriteImage = null;
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let isPlaying = false;
        let animationFrame = null;
        let currentFrame = 0;
        let lastFrameTime = 0;
        let gifBlob = null;

        // 精灵图配置
        const GRID_SIZE = 4; // 4x4格子
        const TOTAL_FRAMES = 16; // 总帧数

        // DOM元素
        const imageInput = document.getElementById('imageInput');
        const fileName = document.getElementById('fileName');
        const fpsSlider = document.getElementById('fpsSlider');
        const fpsValue = document.getElementById('fpsValue');
        const scaleSlider = document.getElementById('scaleSlider');
        const scaleValue = document.getElementById('scaleValue');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        // 上传图片
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileName.textContent = `已选择: ${file.name}`;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    spriteImage = img;
                    initCanvas();
                    showStatus('图片加载成功！可以开始播放和生成GIF', 'success');
                    playBtn.disabled = false;
                    pauseBtn.disabled = false;
                    generateBtn.disabled = false;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 初始化画布
        function initCanvas() {
            const scale = scaleSlider.value / 100;
            const frameWidth = spriteImage.width / GRID_SIZE;
            const frameHeight = spriteImage.height / GRID_SIZE;
            
            canvas.width = frameWidth * scale;
            canvas.height = frameHeight * scale;
            
            drawFrame(0);
        }

        // 绘制指定帧
        function drawFrame(frameIndex) {
            if (!spriteImage) return;

            const scale = scaleSlider.value / 100;
            const frameWidth = spriteImage.width / GRID_SIZE;
            const frameHeight = spriteImage.height / GRID_SIZE;
            
            // 计算当前帧在精灵图中的位置 (从左到右，从上到下)
            const col = frameIndex % GRID_SIZE;
            const row = Math.floor(frameIndex / GRID_SIZE);
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制当前帧
            ctx.drawImage(
                spriteImage,
                col * frameWidth,
                row * frameHeight,
                frameWidth,
                frameHeight,
                0,
                0,
                canvas.width,
                canvas.height
            );
        }

        // 动画循环
        function animate(timestamp) {
            if (!isPlaying) return;

            const fps = parseInt(fpsSlider.value);
            const frameDuration = 1000 / fps;

            if (timestamp - lastFrameTime >= frameDuration) {
                currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
                drawFrame(currentFrame);
                lastFrameTime = timestamp;
            }

            animationFrame = requestAnimationFrame(animate);
        }

        // 播放按钮
        playBtn.addEventListener('click', function() {
            if (!spriteImage) return;
            isPlaying = true;
            lastFrameTime = performance.now();
            animationFrame = requestAnimationFrame(animate);
            showStatus('正在播放动画...', 'info');
        });

        // 暂停按钮
        pauseBtn.addEventListener('click', function() {
            isPlaying = false;
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
            }
            showStatus('动画已暂停', 'info');
        });

        // FPS滑块
        fpsSlider.addEventListener('input', function() {
            fpsValue.textContent = this.value;
        });

        // 缩放滑块
        scaleSlider.addEventListener('input', function() {
            scaleValue.textContent = this.value + '%';
            if (spriteImage) {
                initCanvas();
            }
        });

        // 生成GIF
        generateBtn.addEventListener('click', async function() {
            if (!spriteImage) return;

            // 暂停当前播放
            isPlaying = false;
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
            }

            showStatus('正在生成GIF，请稍候...', 'info');
            progressBar.classList.remove('hidden');
            progressFill.style.width = '0%';
            generateBtn.disabled = true;

            try {
                await generateGIF();
            } catch (error) {
                console.error('生成GIF失败:', error);
                showStatus('生成失败: ' + error.message, 'error');
                progressBar.classList.add('hidden');
                generateBtn.disabled = false;
            }
        });

        // 使用 gifenc 库生成 GIF
        async function generateGIF() {
            // 检查库是否加载
            if (typeof gifenc === 'undefined') {
                throw new Error('GIF编码库未加载');
            }

            const fps = parseInt(fpsSlider.value);
            const scale = scaleSlider.value / 100;
            const frameWidth = Math.floor(spriteImage.width / GRID_SIZE);
            const frameHeight = Math.floor(spriteImage.height / GRID_SIZE);
            const width = Math.floor(frameWidth * scale);
            const height = Math.floor(frameHeight * scale);

            // 创建 GIF 编码器
            const gif = gifenc.GIFEncoder();

            // 创建临时画布用于生成帧
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');

            // 添加所有帧
            for (let i = 0; i < TOTAL_FRAMES; i++) {
                const col = i % GRID_SIZE;
                const row = Math.floor(i / GRID_SIZE);
                
                // 清空临时画布
                tempCtx.clearRect(0, 0, width, height);
                
                // 绘制当前帧
                tempCtx.drawImage(
                    spriteImage,
                    col * frameWidth,
                    row * frameHeight,
                    frameWidth,
                    frameHeight,
                    0,
                    0,
                    width,
                    height
                );
                
                // 获取帧数据
                const imageData = tempCtx.getImageData(0, 0, width, height);
                const palette = gifenc.quantize(imageData.data, 256);
                const index = gifenc.applyPalette(imageData.data, palette);
                
                // 添加帧
                gif.writeFrame(index, width, height, {
                    palette: palette,
                    delay: Math.floor(100 / fps) * 10, // centiseconds
                });
                
                // 更新进度
                const progress = ((i + 1) / TOTAL_FRAMES) * 100;
                progressFill.style.width = progress + '%';
                showStatus(`正在生成GIF... ${Math.round(progress)}%`, 'info');
                
                // 让浏览器有机会更新UI
                await new Promise(resolve => setTimeout(resolve, 10));
            }

            // 完成编码
            gif.finish();

            // 获取 GIF 数据
            const buffer = gif.bytes();
            gifBlob = new Blob([buffer], { type: 'image/gif' });

            console.log('GIF生成成功，大小:', gifBlob.size, 'bytes');
            showStatus('GIF生成成功！点击下载按钮保存', 'success');
            progressBar.classList.add('hidden');
            downloadBtn.classList.remove('hidden');
            generateBtn.disabled = false;
        }

        // 下载GIF
        downloadBtn.addEventListener('click', function() {
            if (!gifBlob) {
                showStatus('没有可下载的GIF，请先生成', 'error');
                return;
            }
            
            try {
                const url = URL.createObjectURL(gifBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sprite-animation-' + Date.now() + '.gif';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                
                // 延迟清理，确保下载开始
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
                
                showStatus('GIF下载已开始！', 'success');
                console.log('GIF下载触发成功');
            } catch (error) {
                console.error('下载失败:', error);
                showStatus('下载失败: ' + error.message, 'error');
            }
        });

        // 显示状态信息
        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.classList.remove('hidden');
        }

        // 检查是否从步骤1跳转过来
        const savedSpriteUrl = sessionStorage.getItem('sprite_image_url');
        if (savedSpriteUrl) {
            // 自动加载精灵图
            fetch(savedSpriteUrl)
                .then(response => response.blob())
                .then(blob => {
                    const file = new File([blob], 'sprite.png', { type: 'image/png' });
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    imageInput.files = dataTransfer.files;
                    
                    // 触发文件加载
                    const img = new Image();
                    img.onload = function() {
                        spriteImage = img;
                        initCanvas();
                        showStatus('精灵图已加载，可以开始制作动画！', 'success');
                        playBtn.disabled = false;
                        pauseBtn.disabled = false;
                        generateBtn.disabled = false;
                        fileName.textContent = `已加载精灵图: sprite.png`;
                    };
                    img.src = savedSpriteUrl;
                    
                    // 清除 sessionStorage
                    sessionStorage.removeItem('sprite_image_url');
                })
                .catch(error => {
                    console.error('加载精灵图失败:', error);
                    showStatus('精灵图加载失败，请手动上传', 'error');
                });
        }
    </script>
</body>
</html>
