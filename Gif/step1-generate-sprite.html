<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>步骤1: 生成精灵图 - Nanobanana Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: #1a1a1a;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .steps {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: #fafafa;
            border-bottom: 1px solid #e8e8e8;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            color: #666;
        }

        .step.active {
            background: #1a1a1a;
            color: white;
        }

        .step-number {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        .step.active .step-number {
            background: white;
            color: #1a1a1a;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1a1a1a;
            font-size: 14px;
        }

        .required {
            color: #f87171;
            margin-left: 4px;
        }

        input[type="password"],
        input[type="url"],
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .helper-text {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }

        .upload-area {
            border: 2px dashed #d0d0d0;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }

        .upload-area:hover {
            border-color: #1a1a1a;
            background: #f5f5f5;
        }

        .upload-area.dragover {
            border-color: #1a1a1a;
            background: #f0f0f0;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 14px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 12px;
            color: #666;
        }

        .preview {
            display: none;
            position: relative;
        }

        .preview img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1a1a1a;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-btn:hover {
            background: #2a2a2a;
        }

        .btn-primary {
            width: 100%;
            padding: 12px 24px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2a2a2a;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .result.success {
            border-color: #10b981;
            background: #ecfdf5;
        }

        .result.error {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .result-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .result-image {
            width: 100%;
            border-radius: 6px;
            margin-top: 12px;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px 20px;
            background: white;
            color: #1a1a1a;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: #1a1a1a;
            background: #fafafa;
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            line-height: 1.6;
        }

        .debug-info {
            margin-top: 12px;
            padding: 12px;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            max-height: 200px;
            overflow-y: auto;
        }

        .debug-info pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Nanobanana Pro 像素精灵图生成器</h1>
            <p>上传图片，生成精灵图动画</p>
        </div>

        <div class="steps">
            <div class="step active">
                <span class="step-number">1</span>
                <span>生成精灵图</span>
            </div>
            <div class="step">
                <span class="step-number">2</span>
                <span>制作动画</span>
            </div>
        </div>

        <div class="content">
            <!-- API 配置 -->
            <div class="section">
                <h2 class="section-title">⚙️ API 配置</h2>
                
                <div class="form-group">
                    <label>
                        API Key
                        <span class="required">*</span>
                    </label>
                    <input type="password" id="apiKey" placeholder="请输入 Dify API Key" required>
                    <div class="helper-text">从 Dify 控制台获取 API Key</div>
                </div>

                <div class="form-group">
                    <label>
                        API Endpoint
                        <span class="required">*</span>
                    </label>
                    <input type="url" id="apiEndpoint" value="https://api.dify.ai/v1/chat-messages" required>
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="debugMode" style="width: auto;">
                        <span>启用调试模式</span>
                    </label>
                    <div class="helper-text">显示详细的请求和响应信息</div>
                </div>
            </div>

            <!-- 输入参数 -->
            <div class="section">
                <h2 class="section-title">📸 输入参数</h2>

                <div class="form-group">
                    <label>
                        上传图片
                        <span class="required">*</span>
                    </label>
                    <input type="file" id="inputImage" accept="image/*" hidden>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">🖼️</div>
                        <div class="upload-text">点击或拖拽上传图片</div>
                        <div class="upload-hint">支持 JPG, PNG, WEBP 格式，最大 10MB</div>
                    </div>
                    <div class="preview" id="preview">
                        <img id="previewImg" src="" alt="预览">
                        <button class="remove-btn" id="removeBtn">✕</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        提示词
                        <span class="required">*</span>
                    </label>
                    <textarea id="prompt" placeholder="描述想要生成的精灵图风格，例如：像素风格、跑步动作、16帧等"></textarea>
                    <div class="helper-text">描述生成精灵图的具体要求</div>
                </div>

                <div class="form-group">
                    <label>
                        像素风格
                    </label>
                    <select id="style">
                        <option value="像素艺术">像素艺术</option>
                        <option value="8位像素">8位像素</option>
                        <option value="16位像素">16位像素</option>
                        <option value="复古像素">复古像素</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>
                        输出尺寸
                    </label>
                    <select id="size">
                        <option value="1K" selected>1K（推荐）</option>
                        <option value="2K">2K（高清）</option>
                        <option value="4K">4K（超高清）</option>
                    </select>
                </div>
            </div>

            <!-- 生成按钮 -->
            <button class="btn-primary" id="generateBtn">
                <span id="btnText">开始生成精灵图</span>
                <span id="btnLoader" style="display: none;">
                    <span class="spinner"></span>
                    生成中...
                </span>
            </button>

            <!-- 结果显示 -->
            <div class="result" id="result">
                <div class="result-title" id="resultTitle"></div>
                <div id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let uploadedFile = null;
        let generatedImageUrl = null;

        // DOM 元素
        const apiKey = document.getElementById('apiKey');
        const apiEndpoint = document.getElementById('apiEndpoint');
        const inputImage = document.getElementById('inputImage');
        const uploadArea = document.getElementById('uploadArea');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const removeBtn = document.getElementById('removeBtn');
        const prompt = document.getElementById('prompt');
        const style = document.getElementById('style');
        const size = document.getElementById('size');
        const debugMode = document.getElementById('debugMode');
        const generateBtn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');

        // 加载保存的配置
        function loadConfig() {
            const savedConfig = localStorage.getItem('dify_sprite_config');
            if (savedConfig) {
                const config = JSON.parse(savedConfig);
                apiKey.value = config.apiKey || '';
                apiEndpoint.value = config.apiEndpoint || 'https://api.dify.ai/v1/chat-messages';
            }
        }

        // 保存配置
        function saveConfig() {
            const config = {
                apiKey: apiKey.value,
                apiEndpoint: apiEndpoint.value
            };
            localStorage.setItem('dify_sprite_config', JSON.stringify(config));
        }

        // 点击上传区域
        uploadArea.addEventListener('click', () => {
            inputImage.click();
        });

        // 文件选择
        inputImage.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        // 处理文件
        function handleFile(file) {
            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件');
                return;
            }

            // 验证文件大小
            if (file.size > 10 * 1024 * 1024) {
                alert('图片大小不能超过 10MB');
                return;
            }

            uploadedFile = file;

            // 显示预览
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                uploadArea.style.display = 'none';
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        // 移除图片
        removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            uploadedFile = null;
            inputImage.value = '';
            uploadArea.style.display = 'block';
            preview.style.display = 'none';
        });

        // 保存 API 配置
        apiKey.addEventListener('change', saveConfig);
        apiEndpoint.addEventListener('change', saveConfig);

        // 生成精灵图
        generateBtn.addEventListener('click', async () => {
            // 验证输入
            if (!apiKey.value) {
                alert('请输入 API Key');
                return;
            }

            if (!uploadedFile) {
                alert('请先上传图片');
                return;
            }

            if (!prompt.value) {
                alert('请输入提示词');
                return;
            }

            // 保存配置
            saveConfig();

            // 显示加载状态
            generateBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'flex';
            result.style.display = 'none';

            try {
                // 步骤1: 上传图片
                console.log('上传图片...');
                const uploadedFileId = await uploadFile(uploadedFile);
                console.log('图片上传成功，文件ID:', uploadedFileId);

                // 步骤2: 调用工作流生成精灵图
                console.log('调用工作流生成精灵图...');
                const response = await generateSprite(uploadedFileId);
                console.log('API 响应:', response);

                // 显示成功结果
                showSuccess(response);

            } catch (error) {
                console.error('生成失败:', error);
                showError(error);
            } finally {
                // 恢复按钮状态
                generateBtn.disabled = false;
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
            }
        });

        // 上传文件到 Dify
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('user', 'user-' + Date.now());

            const response = await fetch('https://api.dify.ai/v1/files/upload', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey.value}`
                },
                body: formData
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(`文件上传失败: ${error.message || response.status}`);
            }

            const data = await response.json();
            return data.id;
        }

        // 调用工作流生成精灵图
        // 严格按照 DIFY_API_INTEGRATION_GUIDE.md 第 48-75 行的格式
        async function generateSprite(fileId) {
            // ⚠️ 关键点：inputimage 必须是包含单个文件对象的数组
            const requestBody = {
                query: prompt.value,  // 顶层必须包含 query
                response_mode: 'blocking',
                user: 'user-' + Date.now(),
                inputs: {
                    prompt: prompt.value,
                    size: size.value,
                    style: style.value,
                    // inputimage 必须是数组，包含一个文件对象
                    inputimage: [
                        {
                            type: 'image',
                            transfer_method: 'local_file',
                            upload_file_id: fileId
                        }
                    ]
                }
            };

            console.log('发送请求:', {
                url: apiEndpoint.value,
                body: requestBody
            });

            const response = await fetch(apiEndpoint.value, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey.value}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            // Get response text first
            const responseText = await response.text();
            console.log('API 响应状态:', response.status);
            console.log('API 响应内容:', responseText);

            if (!response.ok) {
                let errorData;
                try {
                    errorData = JSON.parse(responseText);
                } catch (e) {
                    errorData = { message: responseText };
                }

                // Throw detailed error
                const error = new Error(errorData.message || `API 请求失败`);
                error.status = response.status;
                error.statusText = response.statusText;
                error.details = errorData;
                error.requestBody = requestBody;
                throw error;
            }

            return JSON.parse(responseText);
        }

        // 显示成功结果
        function showSuccess(response) {
            result.className = 'result success';
            result.style.display = 'block';
            resultTitle.textContent = '✅ 精灵图生成成功！';

            // 提取图片 URL
            let imageUrl = null;
            
            if (response.data && response.data.outputs) {
                const outputs = response.data.outputs;
                imageUrl = outputs.image_url || outputs.imageUrl || outputs.image || outputs.output_image;
            }

            if (!imageUrl && response.answer) {
                if (typeof response.answer === 'string' && response.answer.startsWith('http')) {
                    imageUrl = response.answer;
                }
            }

            // 尝试从响应中提取图片URL
            if (!imageUrl) {
                const jsonStr = JSON.stringify(response);
                const urlMatch = jsonStr.match(/(https?:\/\/[^\s"]+\.(jpg|jpeg|png|gif|webp))/i);
                if (urlMatch) {
                    imageUrl = urlMatch[1];
                }
            }

            console.log('提取到的图片 URL:', imageUrl);

            if (imageUrl) {
                generatedImageUrl = imageUrl;
                
                resultContent.innerHTML = `
                    <img src="${imageUrl}" alt="生成的精灵图" class="result-image" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div style="display:none; color: #ef4444; margin-top: 12px;">
                        图片加载失败，URL: <a href="${imageUrl}" target="_blank" style="color: #3b82f6;">${imageUrl}</a>
                    </div>
                    <div class="result-actions">
                        <button class="btn-secondary" onclick="downloadImage('${imageUrl}')">下载精灵图</button>
                        <button class="btn-secondary" onclick="goToStep2('${imageUrl}')">下一步：制作动画</button>
                    </div>
                `;
            } else {
                resultContent.innerHTML = `
                    <div style="color: #666;">
                        <p>生成成功，但未找到图片 URL。</p>
                        <div class="debug-info">
                            <pre>${JSON.stringify(response, null, 2)}</pre>
                        </div>
                    </div>
                `;
            }

            // 滚动到结果
            result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 显示错误
        function showError(error) {
            result.className = 'result error';
            result.style.display = 'block';
            resultTitle.textContent = '❌ 生成失败';

            let errorHtml = `
                <div class="error-message">
                    <strong>错误信息：</strong>${error.message}
                </div>
            `;

            // 添加可能的解决方案
            errorHtml += `
                <div style="margin-top: 12px; padding: 12px; background: #fff; border-radius: 6px; font-size: 13px;">
                    <strong>💡 可能的解决方案：</strong>
                    <ul style="margin: 8px 0 0 20px; line-height: 1.8;">
                        <li><strong>检查 Dify 工作流配置</strong>：
                            <ul style="margin: 4px 0 0 20px;">
                                <li>确认工作流中的输入变量名称（应该是 <code>inputimage</code>、<code>prompt</code>、<code>size</code>、<code>style</code>）</li>
                                <li>确认变量类型正确（inputimage 应该是 File 类型）</li>
                                <li>检查工作流是否有其他必填参数</li>
                            </ul>
                        </li>
                        <li><strong>检查 API Endpoint</strong>：确认是否使用了正确的工作流 API 地址</li>
                        <li><strong>查看工作流日志</strong>：在 Dify 控制台查看工作流执行日志，了解具体失败原因</li>
                        <li><strong>测试工作流</strong>：在 Dify 界面手动测试工作流是否正常工作</li>
                    </ul>
                </div>
            `;

            if (error.details || debugMode.checked) {
                if (error.details) {
                    errorHtml += `
                        <div class="debug-info">
                            <strong>详细错误：</strong>
                            <pre>${JSON.stringify(error.details, null, 2)}</pre>
                        </div>
                    `;
                }

                if (error.requestBody) {
                    errorHtml += `
                        <div class="debug-info">
                            <strong>请求数据：</strong>
                            <pre>${JSON.stringify(error.requestBody, null, 2)}</pre>
                        </div>
                    `;
                }

                if (error.response) {
                    errorHtml += `
                        <div class="debug-info">
                            <strong>原始响应：</strong>
                            <pre>${error.response}</pre>
                        </div>
                    `;
                }
            }

            resultContent.innerHTML = errorHtml;
            result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 下载图片
        function downloadImage(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = 'sprite-' + Date.now() + '.png';
            a.target = '_blank';
            a.click();
        }

        // 进入第二步
        function goToStep2(imageUrl) {
            // 保存生成的精灵图 URL
            sessionStorage.setItem('sprite_image_url', imageUrl);
            // 跳转到第二步页面
            window.location.href = 'sprite-to-gif.html';
        }

        // 页面加载时初始化
        loadConfig();
    </script>
</body>
</html>
